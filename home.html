<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#f5f5f5" id="themeMeta">
    <title>自定义主页</title>
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            height: 100%;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f5f5;
            color: #333;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.3s, color 0.3s;
        }
        :root {
            --accent-color: #4a90d9;
            --bg: #f5f5f5;
            --card-bg: rgba(255, 255, 255, 0.6);
            --text: #333;
            --text-secondary: #999;
            --border: rgba(255, 255, 255, 0.5);
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            --search-radius: 28px;
            --search-border-type: solid;
            --search-border-color: rgba(255, 255, 255, 0.8);
            --icon-size: 36px;
            --text-size: 11px;
            --bookmark-text-color: #333;
            --text-stroke-color: rgba(255, 255, 255, 0.9);
            --text-shadow-color: rgba(0, 0, 0, 0.6);
        }
        body.dark {
            --bg: #1a1a2e;
            --card-bg: rgba(37, 37, 64, 0.6);
            --text: #e0e0e0;
            --text-secondary: #999;
            --border: rgba(255, 255, 255, 0.1);
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
            --bookmark-text-color: #e0e0e0;
            --text-stroke-color: rgba(0, 0, 0, 0.9);
            --text-shadow-color: rgba(255, 255, 255, 0.4);
            background: var(--bg);
            color: var(--text);
        }
        .page-scroll {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: -2;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            pointer-events: none;
            display: none;
        }
        .bg-layer.visible {
            display: block;
        }
        .bg-layer::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.15);
            pointer-events: none;
        }
        body.dark .bg-layer::after {
            background: rgba(0, 0, 0, 0.45);
        }
        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            padding-top: max(10px, 20vh);
            flex: 1 0 auto;
            transition: margin-top 0.2s;
        }
        /* ===== 时钟🔴 ===== */
        .clock-section {
            text-align: center;
            transition: opacity 0.25s, transform 0.25s;
        }
        .clock-section.hidden {
            opacity: 0;
            transform: scale(0.96);
            pointer-events: none;
            height: 0;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        .time {
            font-size: 56px;
            font-weight: 200;
            letter-spacing: 2px;
            line-height: 1;
            color: rgba(255, 255, 255, 0.7);
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.6), 0 0 5px rgba(0, 0, 0, 0.4);
        }
        .date {
            font-size: 14px;
            margin-top: 8px;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.7);
            text-shadow: 0 2px 15px rgba(0, 0, 0, 0.6), 0 0 5px rgba(0, 0, 0, 0.3);
        }
        /* ===== 搜索框 ===== */
        .search-wrapper {
            width: 100%;
            position: relative;
        }
        .search-box {
            width: 100%;
            padding: 14px 48px 14px 80px;
            font-size: 16px;
            border: 2px solid var(--border);
            border-radius: var(--search-radius);
            border-style: var(--search-border-type);
            background: var(--card-bg);
            color: #fff;
            outline: none;
            transition: all 0.2s;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .search-box:focus {
            border-color: var(--accent-color);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
        }
        .search-box::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        .search-engine-btn {
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--border);
            border: none;
            color: #fff;
            font-size: 13px;
            padding: 6px 12px;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.2s;
            z-index: 2;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .search-engine-btn:hover {
            background: var(--accent-color);
        }
        .search-engine-btn:active {
            transform: scale(0.95);
        }
        .search-clear {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            font-size: 18px;
            cursor: pointer;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: none;
            justify-content: center;
            align-items: center;
        }
        .search-clear.visible {
            display: flex;
        }
        .engine-dropdown {
            position: absolute;
            left: 8px;
            top: 52px;
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 14px;
            box-shadow: var(--shadow);
            overflow: hidden;
            z-index: 10;
            display: none;
            min-width: 120px;
            max-height: 200px;
            overflow-y: auto;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .engine-dropdown.show {
            display: block;
        }
        .engine-option {
            padding: 11px 16px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.15s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .engine-option:hover {
            background: var(--border);
        }
        .engine-option.active {
            color: var(--accent-color);
            font-weight: 600;
            background: rgba(74, 144, 217, 0.1);
        }
        .history-dropdown {
            position: absolute;
            left: 0;
            top: 52px;
            width: 100%;
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 14px;
            box-shadow: var(--shadow);
            overflow: hidden;
            z-index: 10;
            display: none;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 4px 0;
        }
        .history-dropdown.show {
            display: block;
        }
        .history-item {
            padding: 10px 16px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.15s;
            color: var(--text);
        }
        .history-item:hover {
            background: var(--border);
        }
        .history-item .h-text {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .history-item .h-del {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 14px;
            cursor: pointer;
            padding: 0 4px;
        }
        .history-item .h-del:hover {
            color: var(--danger);
        }
        .history-clear {
            padding: 8px 16px;
            text-align: center;
            border-top: 1px solid var(--border);
            cursor: pointer;
            font-size: 12px;
            color: var(--text-secondary);
            transition: background 0.15s;
        }
        .history-clear:hover {
            background: var(--border);
        }
        .history-empty {
            padding: 16px;
            text-align: center;
            font-size: 13px;
            color: var(--text-secondary);
        }
        /* ===== 书签网格 ===== */
        .shortcuts {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-top: 16px;
        }
        .shortcut-item {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: grab;
            padding: 12px 4px;
            border-radius: 14px;
            background: transparent !important;
            box-shadow: none !important;
            transition: all 0.2s;
            text-decoration: none;
            color: var(--text);
            min-width: 0;
        }
        .shortcut-item:hover {
            transform: translateY(-2px);
        }
        .shortcut-item:active {
            transform: scale(0.95);
        }
        .shortcut-icon {
            width: var(--icon-size);
            height: var(--icon-size);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: calc(var(--icon-size) / 2.2);
            color: #fff;
            font-weight: 700;
            background: transparent !important;
            flex-shrink: 0;
            transition: all 0.2s;
            overflow: hidden;
            position: relative;
        }
        .shortcut-icon .icon-fallback {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            font-weight: 700;
            color: var(--text);
            text-shadow: -1px -1px 0 var(--text-stroke-color), 1px -1px 0 var(--text-stroke-color), -1px 1px 0 var(--text-stroke-color), 1px 1px 0 var(--text-stroke-color), 0 0 8px var(--text-shadow-color);
        }
        .shortcut-name {
            font-size: var(--text-size);
            text-align: center;
            color: var(--bookmark-text-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            text-shadow: -1px -1px 0 var(--text-stroke-color), 1px -1px 0 var(--text-stroke-color), -1px 1px 0 var(--text-stroke-color), 1px 1px 0 var(--text-stroke-color);
        }
        .shortcut-item .delete-btn,
        .shortcut-item .edit-btn,
        .shortcut-item .move-up-btn,
        .shortcut-item .move-down-btn {
            position: absolute;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            border: none;
            padding: 0;
            line-height: 1;
            font-size: 11px;
            color: #fff;
        }
        .shortcut-item .delete-btn {
            top: -8px;
            right: -8px;
            background: #e05555;
        }
        .shortcut-item .edit-btn {
            top: 14px;
            right: -8px;
            background: #4a90d9;
        }
        .shortcut-item .move-up-btn {
            bottom: 14px;
            right: -8px;
            background: #f0ad4e;
            font-size: 12px;
        }
        .shortcut-item .move-down-btn {
            bottom: -6px;
            right: -8px;
            background: #f0ad4e;
            font-size: 12px;
        }
        .shortcut-item.deleting .delete-btn,
        .shortcut-item.deleting .edit-btn,
        .shortcut-item.deleting .move-up-btn,
        .shortcut-item.deleting .move-down-btn {
            display: flex;
        }
        .sc-empty {
            grid-column: 1/-1;
            padding: 30px 12px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 13px;
            border: 2px dashed var(--border);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        /* ===== 右下角浮动按钮组 ===== */
        .fab-group {
            position: fixed;
            right: 16px;
            bottom: 24px;
            z-index: 60;
            display: flex;
            gap: 10px;
            align-items: center;
            transition: opacity 0.25s, transform 0.25s;
        }
        .fab-group.hidden {
            opacity: 0;
            transform: scale(0.8);
            pointer-events: none;
        }
        .fab-btn {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            border: none;
            background: var(--card-bg);
            color: var(--text);
            cursor: pointer;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 20px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .fab-btn:active {
            transform: scale(0.92);
        }
        .fab-btn.run {
            background: var(--accent-color);
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        .fab-btn.run:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
        /* ★ 小竖线按钮（全透明） */
        .fab-btn.tiny-pipe {
            width: 28px;
            height: 28px;
            font-size: 18px;
            line-height: 1;
            background: transparent !important;
            color: #ffffff;
            border-radius: 50%;
            padding: 0;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: none;
            position: fixed;
            right: 16px;
            bottom: 24px;
            z-index: 61;
            cursor: pointer;
            border: none;
            font-weight: 300;
            transition: all 0.2s;
            text-shadow: 0 0 4px rgba(0,0,0,0.5);
        }
        .fab-btn.tiny-pipe:active {
            transform: scale(0.9);
        }
        .fab-btn.tiny-pipe.show {
            display: flex;
        }
        /* ===== 设置面板 ===== */
        .settings-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            z-index: 110;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s;
        }
        .settings-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .settings-sheet {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            color: var(--text);
            border-radius: 20px 20px 0 0;
            padding: 20px 20px 32px;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
            max-height: 80vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .settings-overlay.active .settings-sheet {
            transform: translateY(0);
        }
        .modal-handle {
            width: 36px;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            align-self: center;
            margin-bottom: 4px;
        }
        .modal-title {
            font-size: 17px;
            font-weight: 600;
            text-align: center;
        }
        .setting-section-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .setting-block {
            padding: 12px;
            background: var(--bg);
            border-radius: 14px;
            border: 2px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .setting-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }
        .setting-btn {
            flex: 1;
            min-width: 60px;
            padding: 10px 0;
            border-radius: 12px;
            border: 2px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            font-size: 13px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .setting-btn:active {
            transform: scale(0.95);
        }
        .setting-btn.primary {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }
        .setting-btn.danger {
            color: #e05555;
            border-color: #ffd4d4;
        }
        .setting-btn.primary.fill {
            background: var(--accent-color);
            color: #fff;
        }
        .setting-row input[type="text"],
        .setting-row input[type="color"],
        .setting-row select {
            flex: 1;
            padding: 8px 12px;
            border-radius: 10px;
            border: 2px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            font-size: 14px;
            outline: none;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .setting-row input:focus,
        .setting-row select:focus {
            border-color: var(--accent-color);
        }
        .setting-row input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            height: 4px;
            border-radius: 2px;
            background: var(--border);
            outline: none;
            cursor: pointer;
        }
        .setting-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent-color);
            border: 2px solid #fff;
            cursor: pointer;
        }
        .layout-val {
            min-width: 40px;
            text-align: right;
            color: var(--accent-color);
            font-weight: 600;
            font-size: 12px;
        }
        .custom-search-field {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }
        .custom-search-field input {
            flex: 1;
            min-width: 80px;
            padding: 6px 10px;
            border-radius: 8px;
            border: 2px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            font-size: 13px;
            outline: none;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .custom-search-field input:focus {
            border-color: var(--accent-color);
        }
        .custom-search-field button {
            padding: 6px 14px;
            border-radius: 8px;
            border: none;
            background: var(--accent-color);
            color: #fff;
            font-size: 13px;
            cursor: pointer;
        }
        .script-manager-view {
            display: none;
        }
        .script-manager-view.active {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .back-btn {
            background: none;
            border: none;
            color: var(--accent-color);
            font-size: 14px;
            cursor: pointer;
            align-self: flex-start;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .script-list-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .script-list-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .script-list-item .sname {
            flex: 1;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .script-list-item .sdel {
            background: #ffd4d4;
            border: none;
            border-radius: 8px;
            padding: 4px 10px;
            color: #e05555;
            font-size: 12px;
            cursor: pointer;
        }
        .script-edit-area {
            display: none;
            flex-direction: column;
            gap: 8px;
            background: var(--card-bg);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .script-edit-area.active {
            display: flex;
        }
        .script-edit-area input {
            width: 100%;
            padding: 8px 12px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            background: var(--card-bg);
            color: var(--text);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .script-edit-area textarea {
            width: 100%;
            height: 120px;
            padding: 8px 12px;
            font-family: monospace;
            font-size: 13px;
            border: 2px solid var(--border);
            border-radius: 10px;
            background: var(--card-bg);
            color: var(--text);
            resize: vertical;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .script-actions {
            display: flex;
            gap: 8px;
        }
        .script-actions .sbtn {
            flex: 1;
            padding: 8px 0;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .sbtn.save {
            background: var(--accent-color);
            color: #fff;
        }
        .sbtn.cancel {
            background: var(--border);
            color: var(--text-secondary);
        }
        .footer {
            text-align: center;
            padding: 16px 12px;
            font-size: 12px;
            color: var(--text-secondary);
            letter-spacing: 2px;
            opacity: 0.7;
            width: 100%;
            max-width: 480px;
            flex-shrink: 0;
        }
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #333;
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 13px;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s;
            white-space: nowrap;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            z-index: 100;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-sheet {
            width: 100%;
            max-width: 480px;

                        <button class="sbtn cancel" id="cancelScriptBtn">取消</button>

    <!-- ===== 编辑书签主弹窗 ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-sheet" id="modalSheet">
            <div class="modal-handle"></div>
            <div class="modal-title" id="modalTitle">📝 编辑书签</div>
            <div id="singleEditArea">
                <div class="modal-field"><label class="modal-label">名称</label><input class="modal-input" id="modalName" type="text" placeholder="网站名称"></div>
                <div class="modal-field"><label class="modal-label">网址</label><input class="modal-input" id="modalUrl" type="text" placeholder="https://..."></div>
                <div class="modal-actions" style="display:flex; gap:6px; margin-top:8px; justify-content:space-between;">
                    <button class="modal-btn cancel" id="modalCancel" style="flex:1; padding:12px 0; font-size:14px; border-radius:10px; background:var(--border); color:var(--text-secondary);">取消</button>
                    <button class="modal-btn save" id="modalSave" style="flex:1; padding:12px 0; font-size:14px; border-radius:10px; background:var(--accent-color); color:#fff;">保存</button>
                    <button class="modal-btn top-btn" id="modalTopBtn" style="flex:1; padding:12px 0; font-size:14px; border-radius:10px; background:#f0ad4e; color:#fff; font-weight:600; border:none;">置顶</button>
                    <button id="modalDelete" style="flex:1; padding:12px 0; font-size:14px; border-radius:10px; background:#ffd4d4; color:#e05555; border:none; cursor:pointer;">删除</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ===== 兼容 GM_* =====
        if (typeof GM_getValue === 'undefined') {
            window.GM_getValue = function(key, def) {
                var val = localStorage.getItem(key);
                return val !== null ? val : def;
            };
            window.GM_setValue = function(key, val) { localStorage.setItem(key, val); };
            window.GM_deleteValue = function(key) { localStorage.removeItem(key); };
            window.GM_listValues = function() { return Object.keys(localStorage); };
        }

        // ===== 基础数据 =====
        var defShortcuts = [];
        var shortcuts = loadShortcuts();
        var editIdx = -1;
        var pressTimer = null;
        var suppressClick = false;
        var isDeletingMode = false;

        const PRESET_ICONS = ['👤', '🔥', '💹', '📘', '📗', '📙', '📔', '💻', '📱', '🎮', '🎯', '💡', '📌', '🎵', '🎶', '🎨', '🌈', '🚀', '⭐', '🌙', '🌊', '🍕', '🍔', '🌮', '🍜', '🍣', '🥤'];

        function loadShortcuts() {
            try {
                var s = localStorage.getItem('home_shortcuts');
                if (s) { var d = JSON.parse(s); if (Array.isArray(d)) return d; }
            } catch (e) {}
            return JSON.parse(JSON.stringify(defShortcuts));
        }
        function saveShortcuts() { try { localStorage.setItem('home_shortcuts', JSON.stringify(shortcuts)); } catch (e) {} }

        // ===== 时钟 =====
        function updateClock() {
            var n = new Date();
            var h = n.getHours(),
                m = n.getMinutes();
            document.getElementById('time').textContent = String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
            var wd = ['日', '一', '二', '三', '四', '五', '六'];
            document.getElementById('date').textContent = n.getFullYear() + '年' + (n.getMonth() + 1) + '月' + n.getDate() + '日 星期' + wd[n.getDay()];
        }
        updateClock();
        setInterval(updateClock, 30000);

        // ===== 搜索引擎管理 =====
        var defaultEngines = [
            { name: ' ', url: 'https://www.bing.com/search?q=' },
            { name: '谷歌', url: 'https://www.google.com/search?q=' },
            { name: 'duck', url: 'https://noai.duckduckgo.com/?q=' },
            { name: '搜狗', url: 'https://www.sogou.com/web?query=' }
        ];
        var hiddenEngines = loadHiddenEngines();
        var customEngines = loadCustomEngines();

        function loadCustomEngines() {
            try { var s = localStorage.getItem('home_custom_engines'); if (s) return JSON.parse(s); } catch (e) {}
            return [];
        }
        function saveCustomEngines() { try { localStorage.setItem('home_custom_engines', JSON.stringify(customEngines)); } catch (e) {} }
        function loadHiddenEngines() {
            try { var s = localStorage.getItem('home_hidden_engines'); if (s) return JSON.parse(s); } catch (e) {}
            return [];
        }
        function saveHiddenEngines() { try { localStorage.setItem('home_hidden_engines', JSON.stringify(hiddenEngines)); } catch (e) {} }
        function getActiveEngines() {
            var visibleDefaults = defaultEngines.filter(function(e) { return hiddenEngines.indexOf(e.name) === -1; });
            return visibleDefaults.concat(customEngines);
        }
        var activeEngines = getActiveEngines();
        var curEng = loadCurEngine();

        function loadCurEngine() {
            try {
                var se = localStorage.getItem('home_engine');
                if (se) { var p = JSON.parse(se); return p; }
            } catch (e) {}
            return activeEngines[0] || { name: '3', url: 'https://www.bing.com/search?q=' };
        }
        function saveCurEngine() { try { localStorage.setItem('home_engine', JSON.stringify(curEng)); } catch (e) {} }

        function renderEngineDropdown() {
            var dd = document.getElementById('engineDropdown');
            dd.innerHTML = activeEngines.map(function(e) {
                return '<div class="engine-option ' + (e.name === curEng.name ? 'active' : '') + '" data-name="' + e.name + '" data-url="' + e.url + '">' +
                    '<span>' + e.name + '</span>' +
                    '</div>';
            }).join('');
            dd.querySelectorAll('.engine-option').forEach(function(o) {
                o.addEventListener('click', function() {
                    var name = this.dataset.name,
                        url = this.dataset.url;
                    curEng = { name: name, url: url };
                    saveCurEngine();
                    updateEngineBtn();
                    dd.classList.remove('show');
                    renderEngineDropdown();
                });
            });
        }
        function updateEngineBtn() { document.getElementById('engineBtn').textContent = curEng.name; }

        function renderEngineManagementList() {
            var cl = document.getElementById('engineManageList');
            var html = '';
            defaultEngines.forEach(function(e) {
                if (hiddenEngines.indexOf(e.name) === -1) {
                    html += '<div style="display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:6px 0;border-bottom:1px solid var(--border);">' +
                        '<span><strong>' + e.name + '</strong> <span style="color:var(--text-secondary);font-size:11px;">' + e.url + '</span></span>' +
                        '<button class="del-engine-btn" data-name="' + e.name + '" data-isdefault="true" style="background:#ffd4d4;border:none;border-radius:6px;padding:2px 10px;color:#e05555;font-size:12px;cursor:pointer;">✕</button>' +
                        '</div>';
                }
            });
            customEngines.forEach(function(e, idx) {
                html += '<div style="display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:6px 0;border-bottom:1px solid var(--border);">' +
                    '<span><strong>' + e.name + '</strong> <span style="color:var(--text-secondary);font-size:11px;">' + e.url + '</span></span>' +
                    '<button class="del-engine-btn" data-name="' + e.name + '" data-isdefault="false" data-idx="' + idx + '" style="background:#ffd4d4;border:none;border-radius:6px;padding:2px 10px;color:#e05555;font-size:12px;cursor:pointer;">✕</button>' +
                    '</div>';
            });
            if (!html) html = '<div style="font-size:12px;color:var(--text-secondary);padding:4px;">暂无可用引擎，请添加或恢复默认</div>';
            cl.innerHTML = html;
            cl.querySelectorAll('.del-engine-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var name = this.dataset.name;
                    var isDefault = this.dataset.isdefault === 'true';
                    if (isDefault) {
                        if (hiddenEngines.indexOf(name) === -1) {
                            hiddenEngines.push(name);
                            saveHiddenEngines();
                        }
                    } else {
                        var idx = parseInt(this.dataset.idx);
                        if (!isNaN(idx) && idx >= 0 && idx < customEngines.length) {
                            customEngines.splice(idx, 1);
                            saveCustomEngines();
                        }
                    }
                    activeEngines = getActiveEngines();
                    if (activeEngines.length > 0 && curEng.name === name) {
                        curEng = activeEngines[0];
                        saveCurEngine();
                    }
                    renderEngineDropdown();
                    updateEngineBtn();
                    renderEngineManagementList();
                    showToast('✅ 已删除: ' + name);
                });
            });
        }

        document.getElementById('restoreDefaultEnginesBtn').addEventListener('click', function() {
            if (confirm('恢复被隐藏的默认搜索引擎（自定义引擎将保留）？')) {
                hiddenEngines = [];
                saveHiddenEngines();
                activeEngines = getActiveEngines();
                curEng = activeEngines[0] || { name: '4', url: 'https://www.bing.com/search?q=' };
                saveCurEngine();
                renderEngineDropdown();
                updateEngineBtn();
                renderEngineManagementList();
                showToast('✅ 已恢复默认引擎');
            }
        });
        document.getElementById('addCustomEng').addEventListener('click', function() {
            var name = document.getElementById('customEngName').value.trim();
            var url = document.getElementById('customEngUrl').value.trim();
            if (!name || !url) { showToast('请填写名称和URL'); return; }
            if (!/^https?:\/\//i.test(url)) { url = 'https://' + url; }
            customEngines.push({ name: name, url: url });
            saveCustomEngines();
            activeEngines = getActiveEngines();
            renderEngineDropdown();
            renderEngineManagementList();
            document.getElementById('customEngName').value = '';
            document.getElementById('customEngUrl').value = '';
            showToast('✅ 已添加自定义引擎');
        });

        renderEngineDropdown();
        updateEngineBtn();
        renderEngineManagementList();
        document.getElementById('engineBtn').addEventListener('click', function(e) {
            e.stopPropagation();
            document.getElementById('engineDropdown').classList.toggle('show');
        });
        document.addEventListener('click', function(e) {
            if (!e.target.closest('#searchWrapper')) {
                document.getElementById('engineDropdown').classList.remove('show');
            }
        });

        // ===== 搜索历史 =====
        var si = document.getElementById('searchInput');
        var sc = document.getElementById('searchClear');
        si.addEventListener('input', function() { sc.classList.toggle('visible', si.value.length > 0); });
        sc.addEventListener('click', function() { si.value = ''; sc.classList.remove('visible'); si.focus(); });

        var searchHistory = loadSearchHistory();
        function loadSearchHistory() {
            try { var s = localStorage.getItem('home_search_history'); if (s) { var d = JSON.parse(s); if (Array.isArray(d)) return d; } } catch (e) {}
            return [];
        }
        function saveSearchHistory() { try { localStorage.setItem('home_search_history', JSON.stringify(searchHistory)); } catch (e) {} }
        function addSearchQuery(query) {
            var q = query.trim();
            if (!q) return;
            var idx = searchHistory.indexOf(q);
            if (idx !== -1) searchHistory.splice(idx, 1);
            searchHistory.unshift(q);
            if (searchHistory.length > 10) searchHistory.pop();
            saveSearchHistory();
        }
        function renderSearchHistory() {
            var hd = document.getElementById('historyDropdown');
            if (!searchHistory || searchHistory.length === 0) {
                hd.innerHTML = '<div class="history-empty">暂无搜索历史</div>';
                return;
            }
            var html = searchHistory.map(function(q) {
                return '<div class="history-item"><span class="h-text">' + q + '</span><button class="h-del" data-q="' + q + '">✕</button></div>';
            }).join('');
            html += '<div class="history-clear" id="clearHistoryBtn">清除所有历史记录</div>';
            hd.innerHTML = html;
            hd.querySelectorAll('.history-item').forEach(function(el) {
                el.addEventListener('click', function(e) {
                    if (e.target.closest('.h-del')) return;
                    var text = this.querySelector('.h-text').textContent;
                    si.value = text;
                    si.focus();
                    var url = buildSearchUrl(curEng.url, text);
                    window.location.href = url;
                });
            });
            hd.querySelectorAll('.h-del').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    var q = this.dataset.q;
                    var idx = searchHistory.indexOf(q);
                    if (idx !== -1) searchHistory.splice(idx, 1);
                    saveSearchHistory();
                    renderSearchHistory();
                    showToast('已删除历史记录');
                });
            });
            var clearBtn = document.getElementById('clearHistoryBtn');
            if (clearBtn) {
                clearBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    if (confirm('确定要清除所有搜索历史记录吗？')) {
                        searchHistory = [];
                        saveSearchHistory();
                        renderSearchHistory();
                        showToast('已清除历史记录');
                    }
                });
            }
        }
        si.addEventListener('focus', function() {
            renderSearchHistory();
            document.getElementById('historyDropdown').classList.add('show');
        });
        si.addEventListener('blur', function() {
            setTimeout(function() { document.getElementById('historyDropdown').classList.remove('show'); }, 200);
        });

        function buildSearchUrl(baseUrl, query) {
            var q = encodeURIComponent(query);
            if (baseUrl.indexOf('{q}') !== -1) return baseUrl.replace(/\{q\}/g, q);
            if (baseUrl.indexOf('%s') !== -1) return baseUrl.replace(/%s/g, q);
            if (baseUrl.indexOf('{searchTerms}') !== -1) return baseUrl.replace(/\{searchTerms\}/g, q);
            if (baseUrl.endsWith('=')) return baseUrl + q;
            var separator = baseUrl.indexOf('?') !== -1 ? '&' : '?';
            return baseUrl + separator + 'q=' + q;
        }
        si.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && si.value.trim()) {
                var query = si.value.trim();
                addSearchQuery(query);
                var url = buildSearchUrl(curEng.url, query);
                window.location.href = url;
            }
        });

        // ===== 书签显示模式 =====
        var iconDisplayMode = localStorage.getItem('home_icon_mode') || 'icon';
        var viewMode = localStorage.getItem('home_view_mode') || 'grid';

        function truncateByChars(text, maxChars) {
            if (!text) return '';
            return text.length > maxChars ? text.substring(0, maxChars) + '…' : text;
        }

        // ===== 渲染书签 =====
        function renderShortcuts() {
            var cont = document.getElementById('shortcuts');
            var hasNewIcon = false;
            for (var i = 0; i < shortcuts.length; i++) {
                if (!shortcuts[i].icon) {
                    shortcuts[i].icon = PRESET_ICONS[i % PRESET_ICONS.length];
                    hasNewIcon = true;
                }
            }
            if (hasNewIcon) saveShortcuts();
            if (shortcuts.length === 0) {
                cont.innerHTML = '<div class="sc-empty">双击空白处，添加书签 ✨</div>';
                return;
            }

            var html = '';
            if (viewMode === 'list') {
                cont.style.display = 'flex';
                cont.style.flexDirection = 'column';
                cont.style.gap = '1px';
                cont.style.gridTemplateColumns = 'none';
                for (var i = 0; i < shortcuts.length; i++) {
                    var s = shortcuts[i];
                    var iconContent = (iconDisplayMode === 'text') ?
                        '<span class="icon-fallback">' + (s.name || '网').charAt(0) + '</span>' :
                        '<span class="icon-fallback">' + s.icon + '</span>';
                    var safeName = truncateByChars(s.name, 28);
                    var safeUrl = truncateByChars(s.url, 50);
                    html += `<div class="shortcut-item list-mode" data-index="${i}" style="display:flex; flex-direction:row; align-items:center; width:100%; padding:1px 0; background:transparent !important; box-shadow:none !important; border-radius:0 !important; cursor:pointer;">
                                <div class="shortcut-icon" style="flex-shrink:0; width:var(--icon-size); height:var(--icon-size); display:flex; align-items:center; justify-content:center; border-radius:10px; overflow:hidden; font-size:calc(var(--icon-size) / 2.2); color:#fff; font-weight:700; background:transparent !important;">${iconContent}</div>

        function getLibrary() {

        function saveLibrary(lib) {
            try { localStorage.setItem('home_library_bookmarks', JSON.stringify(lib)); } catch (e) {}
        }

        function autoCompleteUrl(url) {
            url = url.trim();
            if (!url) return url;
            if (!/^https?:\/\//i.test(url)) return 'https://' + url;
            return url;
        }

        function parseClipText(text) {
            text = text.trim();
            var title = '',
                url = '';
            var m1 = text.match(/标题[：:]\s*(.*?)\s*网址[：:]\s*(.*)/);
            if (m1) {
                title = m1[1].trim();
                url = autoCompleteUrl(m1[2].trim());
                return { title, url };
            }
            var urlMatch = text.match(/https?:\/\/[^\s]+/);
            if (urlMatch) {
                url = urlMatch[0];
                var parts = text.split(url);
                if (parts.length > 0 && parts[0].trim()) {
                    title = parts[0].trim().replace(/^标题[：:]\s*/, '').trim();
                } else title = '未命名网页';
                return { title, url };
            }
            var domainMatch = text.match(/([a-zA-Z0-9-]+\.([a-zA-Z]{2,})[a-zA-Z0-9-]*)/);
            if (domainMatch) {
                url = autoCompleteUrl(domainMatch[1]);
                var parts = text.split(domainMatch[0]);
                if (parts.length > 0 && parts[0].trim()) {
                    title = parts[0].trim().replace(/^标题[：:]\s*/, '').trim();
                } else title = '未命名网页';
                return { title, url };
            }
            if (text) {
                title = text;
                url = '#';
                return { title, url };
            }
            return { title: '未命名', url: '#' };
        }

        var isBatchMode = false;

        // ★ 渲染书签库列表（支持过滤）★
        function renderLibraryList(filterText) {
            var lib = getLibrary();
            var cont = document.getElementById('libListContainer');
            if (!cont) return;

            // 如果传入了过滤文本，进行过滤
            var filtered = lib;
            if (filterText && filterText.trim()) {
                var keyword = filterText.trim().toLowerCase();
                filtered = lib.filter(function(item) {
                    var name = (item.name || '').toLowerCase();
                    var url = (item.url || '').toLowerCase();
                    return name.indexOf(keyword) !== -1 || url.indexOf(keyword) !== -1;
                });
            }

            if (filtered.length === 0) {
                cont.innerHTML = '<div class="lib-empty">' + (lib.length === 0 ? '暂无书签，请在上方粘贴后点击“解析”' : '没有匹配的书签') + '</div>';
                return;
            }

            var html = '';
            filtered.forEach(function(item, idx) {
                // 获取在原始库中的真实索引（用于操作）
                var realIdx = lib.indexOf(item);
                var name = item.name || '未命名';
                if (name.length > 20) name = name.substring(0, 20) + '…';
                var url = item.url || '#';
                if (url.length > 40) url = url.substring(0, 40) + '…';
                var checkboxHtml = isBatchMode ? '<input type="checkbox" class="lib-check" data-idx="' + realIdx + '" style="margin-right:6px; width:16px; height:16px; cursor:pointer;">' : '';
                html += '<div class="lib-row" data-idx="' + realIdx + '">' +
                    '<div class="lib-info" data-idx="' + realIdx + '">' +
                    checkboxHtml +
                    '<span class="lib-name">' + name + '</span>' +
                    '<span class="lib-url">' + url + '</span>' +
                    '</div>' +
                    '<div class="lib-actions">' +
                    '<button class="btn-add" data-idx="' + realIdx + '" title="添加到主页">➕</button>' +
                    '<button class="btn-edit" data-idx="' + realIdx + '" title="修改">✏️</button>' +
                    '<button class="btn-del" data-idx="' + realIdx + '" title="删除">✕</button>' +
                    '</div></div>';
            });
            cont.innerHTML = html;

            // 事件绑定（使用真实索引）
            cont.querySelectorAll('.lib-info').forEach(function(el) {
                el.addEventListener('click', function(e) {
                    if (e.target.closest('.lib-check')) return;
                    var idx = parseInt(this.dataset.idx);
                    var lib = getLibrary();
                    if (idx < 0 || idx >= lib.length) return;
                    var item = lib[idx];
                    if (item.url && item.url !== '#') {

                        window.open(item.url, '_blank');
                        closeLibrary();
                    }
                });
            });
            cont.querySelectorAll('.btn-add').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    var idx = parseInt(this.dataset.idx);
                    var lib = getLibrary();
                    if (idx < 0 || idx >= lib.length) return;
                    var item = lib[idx];
                    var exists = shortcuts.some(function(b) { return b.url === item.url; });
                    if (exists) { showToast('⚠️ 该书签已在网格中'); return; }
                    shortcuts.push({ name: item.name || '未命名', icon: (item.name || '网').charAt(0), url: item.url });
                    saveShortcuts();
                    renderShortcuts();
                    showToast('✅ 已添加到主页');
                    // 重新应用当前过滤

                });

            cont.querySelectorAll('.btn-edit').forEach(function(btn) {

            cont.querySelectorAll('.btn-del').forEach(function(btn) {

                        lib.splice(idx, 1);

                        renderLibraryList();
                        showToast('已从书签库删除');
                        // 重新应用当前过滤
                        refreshLibraryView();

                });

            if (isBatchMode) {
                cont.querySelectorAll('.lib-check').forEach(function(cb) {
                    cb.addEventListener('click', function(e) { e.stopPropagation(); });
                });
            }
            updateBatchButtonText();
        }

        // ★ 解析按钮（解析后清空过滤）★
        document.getElementById('libParseBtn').addEventListener('click', function() {
            forceExitAnd(function() {
                var raw = document.getElementById('libClipboardInput').value.trim();
                if (!raw) { showToast('⚠️ 请先粘贴内容'); return; }
                var lines = raw.split('\n').filter(function(line) { return line.trim() !== ''; });
                var parsedItems = [];
                lines.forEach(function(line) {
                    var parsed = parseClipText(line);
                    if (!parsed.url || parsed.url === '#') return;
                    parsedItems.push({ name: parsed.title || '未命名', icon: (parsed.title || '网').charAt(0),
                        url: parsed.url });
                });
                if (parsedItems.length === 0) { showToast('⚠️ 未能解析出有效书签，请检查格式'); return; }
                var lib = getLibrary();
                var newUniqueItems = [];
                parsedItems.forEach(function(item) {
                    var exists = lib.some(function(b) { return b.url === item.url; });
                    if (!exists) newUniqueItems.push(item);
                });
                if (newUniqueItems.length === 0) { showToast('⚠️ 所有解析出的书签均已存在'); return; }
                lib = newUniqueItems.concat(lib);

                renderLibraryList('');

            });
        });

        document.getElementById('libImportBtn').addEventListener('click', function() {

            var fInput = document.createElement('input');

            fInput.accept = '.json,.html,.htm';
            fInput.style.display = 'none';
            document.body.appendChild(fInput);
            fInput.click();
            fInput.addEventListener('change', function() {
                var file = this.files[0];
                if (!file) return;
                var r = new FileReader();
                r.onload = function(ev) {
                    var content = ev.target.result;
                    var newItems = [];
                    var isHtml = /\.html?$/i.test(file.name);
                    if (isHtml) {
                        var parser = new DOMParser();
                        var doc = parser.parseFromString(content, 'text/html');
                        doc.querySelectorAll('a').forEach(function(a) {
                            var url = a.getAttribute('href');
                            if (url && url.startsWith('http')) {
                                newItems.push({ name: a.textContent.trim() || '未命名', icon: '🔗',
                                    url: url });
                            }
                        });
                    } else {
                        try {
                            var data = JSON.parse(content);
                            if (Array.isArray(data)) {
                                newItems = data.map(function(item) {
                                    return { name: item.name || '未命名', icon: '🔗', url: item.url ||
                                            '#' };
                                });
                            } else { showToast('❌ JSON 格式不支持'); return; }
                        } catch (e) { showToast('❌ 文件解析失败'); return; }
                    }
                    if (newItems.length === 0) { showToast('⚠️ 未找到有效书签'); return; }
                    var lib = getLibrary();
                    var addedItems = [],
                        added = 0;
                    newItems.forEach(function(item) {
                        if (!item.url || item.url === '#') return;
                        var exists = lib.some(function(b) { return b.url === item.url; });
                        if (!exists) { addedItems.push(item);
                            added++; }
                    });
                    if (added > 0) {
                        lib = addedItems.concat(lib);
                        saveLibrary(lib);
                        renderLibraryList('');
                        showToast('✅ 成功导入 ' + added + ' 个书签');
                    } else showToast('⚠️ 所有书签均已存在');
                    refreshLibraryView();
                };
                r.readAsText(file);
                this.value = '';
            });
        });

        function performSearch(keyword) {
            if (!keyword) { searchResultsContainer.innerHTML = '<div class="search-empty">请输入关键字开始搜索</div>'; return; }
            keyword = keyword.toLowerCase();
            var results = [];
            shortcuts.forEach(function(item, index) {
                if ((item.name || '').toLowerCase().indexOf(keyword) !== -1 || (item.url || '').toLowerCase().indexOf(
                        keyword) !== -1) {
                    results.push({ type: 'home', data: item, index: index });
                }
            });
            var library = getLibrary();
            library.forEach(function(item, index) {
                if ((item.name || '').toLowerCase().indexOf(keyword) !== -1 || (item.url || '').toLowerCase().indexOf(
                        keyword) !== -1) {
                    results.push({ type: 'library', data: item, index: index });
                }
            });
            if (results.length === 0) {
                searchResultsContainer.innerHTML = '<div class="search-empty">没有找到匹配的书签</div>';
                return;
            }
            var html = '';
            results.forEach(function(res) {
                var sourceLabel = res.type === 'home' ? '[主页]' : '[书签库]';
                var sourceColor = res.type === 'home' ? 'var(--accent-color)' : '#f0ad4e';
                html += `<div class="search-result-item" data-type="${res.type}" data-index="${res.index}">
                            <div style="display:flex;flex-direction:column;">
                                <span class="sr-name"><span class="sr-source" style="border-color:${sourceColor}; color:${sourceColor};">${sourceLabel}</span>${truncateByChars(res.data.name, 30)}</span>
                                <span class="sr-url">${truncateByChars(res.data.url, 40)}</span>
                            </div>
                        </div>`;
            });
            searchResultsContainer.innerHTML = html;
            searchResultsContainer.querySelectorAll('.search-result-item').forEach(function(el) {
                el.addEventListener('click', function() {
                    var type = this.dataset.type;
                    var idx = parseInt(this.dataset.index);
                    closeSearch();
                    removeAllHighlights();
                    if (type === 'home' && idx >= 0 && idx < shortcuts.length) {
                        var targetEl = document.querySelectorAll('.shortcut-item')[idx];
                        if (targetEl) {
                            var container = document.getElementById('pageScroll');
                            smartScrollTo(targetEl, container, -80);
                            targetEl.classList.add('search-highlight');
                            currentHighlightIndex = idx;
                        }
                    } else if (type === 'library') {
                        openLibrary();
                        setTimeout(function() {
                            var libCont = document.getElementById('libListContainer');
                            var libRows = libCont.querySelectorAll('.lib-row');
                            if (libRows && libRows.length > idx) {
                                var targetLibRow = libRows[idx];
                                smartScrollTo(targetLibRow, libCont, -80);
                                targetLibRow.classList.add('search-highlight');
                            }
                        }, 500);
                    }
                });
            });
        }

        function smartScrollTo(element, container, offsetY) {
            if (!element || !container) return;
            offsetY = offsetY || -80;
            var containerHeight = container.clientHeight;
            var elHeight = element.offsetHeight;
            var targetScrollTop = element.offsetTop - (containerHeight / 2) + (elHeight / 2) + offsetY;
            if (targetScrollTop < 0) targetScrollTop = 0;
            if (targetScrollTop > container.scrollHeight - containerHeight) targetScrollTop = container.scrollHeight -
                containerHeight;
            container.scrollTo({ top: targetScrollTop, behavior: 'smooth' });
        }

        searchKeywordInput.addEventListener('input', function() {
            var val = this.value.trim();
            if (val) localStorage.setItem('home_search_query', val);
            else localStorage.removeItem('home_search_query');
            performSearch(val);
        });
        searchClearBtn.addEventListener('click', function() {
            searchKeywordInput.value = '';
            localStorage.removeItem('home_search_query');
            searchResultsContainer.innerHTML = '<div class="search-empty">请输入关键字开始搜索</div>';
            searchKeywordInput.focus();
        });

        function openSearch() {
            searchOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
            var lastQuery = localStorage.getItem('home_search_query') || '';
            searchKeywordInput.value = lastQuery;
            if (lastQuery) performSearch(lastQuery);
            else searchResultsContainer.innerHTML = '<div class="search-empty">请输入关键字开始搜索</div>';
            setTimeout(function() { searchKeywordInput.focus(); }, 300);
        }

        function closeSearch() {
            searchOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }
        document.getElementById('searchFab').addEventListener('click', openSearch);
        searchCloseBtn.addEventListener('click', closeSearch);
        searchOverlay.addEventListener('click', function(e) { if (e.target === this) closeSearch(); });

        document.addEventListener('click', function(e) {
            if (currentHighlightIndex === -1) return;
            if (e.target.closest('.search-overlay') || e.target.closest('.search-result-item')) return;
            removeAllHighlights();
        });

        // ===== 初始化 =====
        applyAllSettings();
        renderShortcuts();
        renderLibraryList(''); // 初始显示全部
    </script>
</body>
</html>
