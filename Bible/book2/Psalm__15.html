<dl><b><a style=" font-size:15px;">15:1</a> </b> （大卫的诗。）耶和华阿，谁能寄居你的帐幕？谁能住在你的圣山？
<dl><b><a style=" font-size:15px;">15:2</a> </b> 就是行为正直，作事公义，心里说实话的人。
<dl><b><a style=" font-size:15px;">15:3</a> </b> 他不以舌头谗谤人，不恶待朋友，也不随伙毁谤邻里。
<dl><b><a style=" font-size:15px;">15:4</a> </b> 他眼中藐视匪类，却尊重那敬畏耶和华的人。他发了誓，虽然自己吃亏，也不更改。
<dl><b><a style=" font-size:15px;">15:5</a> </b> 他不放债取利，不受贿赂以害无辜。行这些事的人，必永不动摇。
