<dl><b><a style=" font-size:15px;">13:1</a> </b> （大卫的诗，交与伶长。）耶和华阿，你忘记我要到几时呢？要到永远吗？你掩面不顾我要到几时呢？
<dl><b><a style=" font-size:15px;">13:2</a> </b> 我心里筹算，终日愁苦，要到几时呢？我的仇敌升高压制我，要到几时呢？
<dl><b><a style=" font-size:15px;">13:3</a> </b> 耶和华我的神阿，求你看顾我，应允我，使我眼目光明，免得我沉睡至死。
<dl><b><a style=" font-size:15px;">13:4</a> </b> 免得我的仇敌说，我胜了他。免得我的敌人在我摇动的时候喜乐。
<dl><b><a style=" font-size:15px;">13:5</a> </b> 但我倚靠你的慈爱。我的心因你的救恩快乐。
<dl><b><a style=" font-size:15px;">13:6</a> </b> 我要向耶和华歌唱，因他用厚恩待我。
