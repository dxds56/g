<dl><b><a style=" font-size:15px;">11:1</a> </b> （大卫的诗，交与伶长。）我是投靠耶和华。你们怎么对我说，你当像鸟飞往你的山去。
<dl><b><a style=" font-size:15px;">11:2</a> </b> 看哪，恶人弯弓，把箭搭在弦上，要在暗中射那心里正直的人。
<dl><b><a style=" font-size:15px;">11:3</a> </b> 根基若毁坏，义人还能作什么呢？
<dl><b><a style=" font-size:15px;">11:4</a> </b> 耶和华在他的圣殿里，耶和华的宝座在天上。他的慧眼察看世人。
<dl><b><a style=" font-size:15px;">11:5</a> </b> 耶和华试验义人。惟有恶人和喜爱强暴的人，他心里恨恶。
<dl><b><a style=" font-size:15px;">11:6</a> </b> 他要向恶人密布网罗。有烈火，硫磺，热风，作他们杯中的分。
<dl><b><a style=" font-size:15px;">11:7</a> </b> 因为耶和华是公义的。他喜爱公义。正直人必得见他的面。
