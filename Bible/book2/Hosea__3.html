<dl><b><a style=" font-size:15px;">3:1</a> </b> 耶和华对我说，你再去爱一个淫妇，就是她情人所爱的，好像以色列人。虽然偏向别神，喜爱葡萄饼，耶和华还是爱他们。
<dl><b><a style=" font-size:15px;">3:2</a> </b> 我便用银子十五舍客勒，大麦一贺梅珥半，买她归我。
<dl><b><a style=" font-size:15px;">3:3</a> </b> 我对她说，你当多日为我独居，不可行淫，不可归别人为妻，我向你也必这样。
<dl><b><a style=" font-size:15px;">3:4</a> </b> 以色列人也必多日独居，无君王，无首领，无祭祀，无柱像，无以弗得，无家中的神像。
<dl><b><a style=" font-size:15px;">3:5</a> </b> 后来以色列人必归回（或作回心转意），寻求他们的神耶和华，和他们的王大卫。在末后的日子，必以敬畏的心归向耶和华，领受他的恩惠。
