<dl><b><a style=" font-size:15px;">12:1</a> </b> 到那日，你必说，耶和华阿，我要称谢你因为你虽然向我发怒，你的怒气却已转消，你又安慰了我。
<dl><b><a style=" font-size:15px;">12:2</a> </b> 看哪，神是我的拯救。我要倚靠他，并不惧怕。因为主耶和华是我的力量，是我的诗歌。他也成了我的拯救。
<dl><b><a style=" font-size:15px;">12:3</a> </b> 所以你们必从救恩的泉源欢然取水。
<dl><b><a style=" font-size:15px;">12:4</a> </b> 在那日，你们要说，当称谢耶和华，求告他的名，将他所行的传扬在万民中，提说他的名已被尊崇。
<dl><b><a style=" font-size:15px;">12:5</a> </b> 你们要向耶和华唱歌。因他所行的甚是美好。但愿这事普传天下。
<dl><b><a style=" font-size:15px;">12:6</a> </b> 锡安的居民哪，当扬声欢呼。因为在你们中间的以色列圣者，乃为至大。
