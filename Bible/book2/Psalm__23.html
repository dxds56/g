<dl><b><a style=" font-size:15px;">23:1</a> </b> （大卫的诗。）耶和华是我的牧者。我必不至缺乏。
<dl><b><a style=" font-size:15px;">23:2</a> </b> 他使我躺卧在青草地上，领我在可安歇的水边。
<dl><b><a style=" font-size:15px;">23:3</a> </b> 他使我的灵魂苏醒，为自己的名引导我走义路。
<dl><b><a style=" font-size:15px;">23:4</a> </b> 我虽然行过死荫的幽谷，也不怕遭害。因为你与我同在。你的杖，你的竿，都安慰我。
<dl><b><a style=" font-size:15px;">23:5</a> </b> 在我敌人面前，你为我摆设筵席。你用油膏了我的头，使我的福杯满溢。
<dl><b><a style=" font-size:15px;">23:6</a> </b> 我一生一世必有恩惠慈爱随着我。我且要住在耶和华的殿中，直到永远。
