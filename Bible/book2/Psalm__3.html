<dl><b><a style=" font-size:15px;">3:1</a> </b> （大卫逃避他儿子押沙龙的时候作的诗。）耶和华阿，我的敌人何其加增。有许多人起来攻击我。
<dl><b><a style=" font-size:15px;">3:2</a> </b> 有许多人议论我说，他得不着神的帮助。（细拉）
<dl><b><a style=" font-size:15px;">3:3</a> </b> 但你耶和华是我四围的盾牌。是我的荣耀，又是叫我抬起头来的。
<dl><b><a style=" font-size:15px;">3:4</a> </b> 我用我的声音求告耶和华，他就从他的圣山上应允我。（细拉）
<dl><b><a style=" font-size:15px;">3:5</a> </b> 我躺下睡觉。我醒着。耶和华都保佑我。
<dl><b><a style=" font-size:15px;">3:6</a> </b> 虽有成万的百姓来周围攻击我，我也不怕。
<dl><b><a style=" font-size:15px;">3:7</a> </b> 耶和华阿，求你起来。我的神阿，求你救我。因为你打了我一切仇敌的腮骨，敲碎了恶人的牙齿。
<dl><b><a style=" font-size:15px;">3:8</a> </b> 救恩属乎耶和华。愿你赐福给你的百姓。（细拉）
