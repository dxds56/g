<dl><b><a style=" font-size:15px;">25:1</a> </b> 书亚人比勒达回答说，
<dl><b><a style=" font-size:15px;">25:2</a> </b> 神有治理之权，有威严可畏。他在高处施行和平。
<dl><b><a style=" font-size:15px;">25:3</a> </b> 他的诸军，岂能数算？他的光亮一发，谁不蒙照呢？
<dl><b><a style=" font-size:15px;">25:4</a> </b> 这样在神面前，人怎能称义？妇人所生的怎能洁净？
<dl><b><a style=" font-size:15px;">25:5</a> </b> 在神眼前，月亮也无光亮，星宿也不清洁。
<dl><b><a style=" font-size:15px;">25:6</a> </b> 何况如虫的人，如蛆的世人呢？
